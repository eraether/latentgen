<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><title>latentgen pipeline overview</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1180" height="620" fill="#ffffff"/><text x="590" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:20px;font-weight:700;fill:#111827">The whole pipeline: four training stages, one generation step (4)</text><text x="590" y="52" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563;font-style:italic">arrows carry data; each box is one script in scripts/</text><rect x="40" y="150" width="90" height="70" rx="6" fill="#fde68a" stroke="#ca8a04" stroke-width="1.4"/><circle cx="85.0" cy="179.4" r="12.6" fill="#fbbf24" stroke="#ca8a04"/><path d="M58.0,213.0 Q85.0,188.5 112.0,213.0" fill="#f59e0b" stroke="#ca8a04"/><text x="85.0" y="236" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">your image folder</text><text x="85" y="250" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:normal;fill:#4b5563">512 x 512 x 3</text><rect x="200" y="100" width="230" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="315.0" y="120" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Stage 1a  VQ-VAE</text><text x="315.0" y="138" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">image -&gt; 32x32 grid of codes</text><text x="315.0" y="154" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">codebook of 256 vectors</text><text x="315.0" y="170" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">scripts/01a_train_vqvae.py</text><rect x="200" y="240" width="230" height="110" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="315.0" y="260" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Stage 1b  Autoencoder</text><text x="315.0" y="278" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">image -&gt; 32x32x32 latent in [-1,1]</text><text x="315.0" y="294" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">keeps ~32x more detail than VQ</text><text x="315.0" y="310" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">scripts/01b_train_autoencoder.py</text><line x1="135" y1="170" x2="198" y2="155" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="135" y1="200" x2="198" y2="295" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="85" y="268" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:normal;fill:#4b5563;font-style:italic">(1a and 1b are trained</text><text x="85" y="281" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;font-weight:normal;fill:#4b5563;font-style:italic">independently)</text><rect x="500" y="160" width="220" height="110" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.6"/><text x="610.0" y="180" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Stage 1c  Encode</text><text x="610.0" y="198" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">run every image (and its flip)</text><text x="610.0" y="214" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">through both frozen models</text><text x="610.0" y="230" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">scripts/01c_encode_dataset.py</text><line x1="432" y1="155" x2="498" y2="195" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="432" y1="295" x2="498" y2="235" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="790" y="150" width="190" height="130" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="885.0" y="170" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">data/encoded/</text><text x="885.0" y="188" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">coarse_encoded.pt</text><text x="885.0" y="204" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">int16 codes [N, 2, 32, 32]</text><text x="885.0" y="220" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">fine_encoded.pt</text><text x="885.0" y="236" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">int8 latents [N, 2, 32, 32, 32]</text><text x="885.0" y="252" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">MaskGIT reads only coarse</text><line x1="722" y1="215" x2="788" y2="215" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="500" y="360" width="220" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="610.0" y="380" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Stage 2  MaskGIT</text><text x="610.0" y="398" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">learns p(code grid)</text><text x="610.0" y="414" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">masked-token transformer, 24 layers</text><text x="610.0" y="430" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">scripts/02_train_maskgit.py</text><rect x="790" y="360" width="220" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="900.0" y="380" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Stage 3  cGAN</text><text x="900.0" y="398" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">codes -&gt; AE latent</text><text x="900.0" y="414" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">generator 12 / discriminator 16 layers</text><text x="900.0" y="430" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">scripts/03_train_cgan.py</text><path d="M860,282 L860,320 L610,320 L610,358" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="735" y="312" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codes only</text><line x1="885" y1="282" x2="885" y2="358" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="895" y="340" text-anchor="start" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codes + latents</text><rect x="260" y="500" width="720" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="620.0" y="520" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Generate   scripts/04_generate.py</text><text x="620.0" y="538" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">MaskGIT samples a 32x32 code grid from nothing  -&gt;  VQ-VAE decoder: faithful but soft image</text><text x="620.0" y="554" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">                                                 -&gt;  GAN generator -&gt; AE decoder: sharp image</text><line x1="610" y1="472" x2="610" y2="498" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="900" y1="472" x2="900" y2="498" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260,352 L260,470 L330,470 L330,498" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M198,195 L180,195 L180,480 L300,480 L300,498" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="185" y="492" text-anchor="start" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563;font-style:italic">frozen decoders</text></svg>