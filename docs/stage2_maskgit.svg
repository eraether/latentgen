="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="225" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">mask r ~ U[0.3, 1.0]</text><rect x="260" y="110" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="286" y="110" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="312" y="110" width="26" height="26" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="338" y="110" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="364" y="110" width="26" height="26" fill="#ddd6fe" stroke="#7c3aed" stroke-width="0.8"/><rect x="260" y="136" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="286" y="136" width="26" height="26" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="312" y="136" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="338" y="136" width="26" height="26" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="364" y="136" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="260" y="162" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="286" y="162" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="312" y="162" width="26" height="26" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="338" y="162" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="364" y="162" width="26" height="26" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="260" y="188" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="286" y="188" width="26" height="26" fill="#a5f3fc" stroke="#7c3aed" stroke-width="0.8"/><rect x="312" y="188" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="338" y="188" width="26" height="26" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="364" y="188" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="260" y="214" width="26" height="26" fill="#ddd6fe" stroke="#7c3aed" stroke-width="0.8"/><rect x="286" y="214" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="312" y="214" width="26" height="26" fill="#a5f3fc" stroke="#7c3aed" stroke-width="0.8"/><rect x="338" y="214" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><rect x="364" y="214" width="26" height="26" fill="url(#hatch)" stroke="#7c3aed" stroke-width="0.8"/><text x="325.0" y="256" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">masked positions = [MASK] embedding</text><line x1="400" y1="175" x2="450" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="455" y="95" width="300" height="160" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="605.0" y="115" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">MaskGIT  (latentgen/nn/maskgit.py)</text><text x="605.0" y="133" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">code_embedding [256, 512] (+ learned mask token)</text><text x="605.0" y="149" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">RoPE: axial (row / column) for images, 1-D for audio</text><text x="605.0" y="165" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">24 x TransformerLayer (attention + SwiGLU)</text><text x="605.0" y="181" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">final RMSNorm -&gt; Linear to 256 logits per position</text><text x="605.0" y="197" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="605.0" y="213" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: logits [B, 32, 32, 256]</text><line x1="757" y1="175" x2="805" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="810" y="95" width="320" height="160" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="970.0" y="115" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Loss</text><text x="970.0" y="133" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">cross-entropy ONLY at masked positions</text><text x="970.0" y="149" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">(the visible ones are given, not predicted)</text><text x="970.0" y="165" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="970.0" y="181" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">reported per mask-ratio bucket:</text><text x="970.0" y="197" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">100-91% masked  (global structure, hard)</text><text x="970.0" y="213" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">...  40-30% masked  (local detail, easy)</text><rect x="60" y="300" width="1070" height="95" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="595.0" y="320" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Why mask ratios 30 %..100 %?</text><text x="595.0" y="338" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Generation starts from a fully masked grid and every refine round re-masks 36 %..99 % of it, so the hard,</text><text x="595.0" y="354" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">high-density states dominate. Inside a fill the mask thins out further; those easier states are left to generalize.</text><rect x="60" y="415" width="1070" height="85" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="595.0" y="435" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Training data path</text><text x="595.0" y="453" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">only coarse_encoded.pt is read (int16 codes, 70k x 2 x 32 x 32 = 290 MB), held in CPU RAM or VRAM; a batch is a random</text><text x="595.0" y="469" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">gather of rows + a random flip variant. Datasets too big for RAM are chunked by stage 1c and streamed in the background.</text></svg>