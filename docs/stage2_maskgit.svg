<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520"><title>stage 2 MaskGIT</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1180" height="520" fill="#ffffff"/><text x="590" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:19px;font-weight:700;fill:#111827">Stage 2: MaskGIT learns the distribution of code grids</text><text x="590" y="52" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563;font-style:italic">a bidirectional transformer: hide part of the grid, predict what was there</text><rect x="60" y="110" width="26" height="26" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="86" y="110" width="26" height="26" fill="#fbcfe8" stroke="#7c3aed" stroke-width="0.8"/><rect x="112" y="110" width="26" height="26" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="138" y="110" width="26" height="26" fill="#fed7aa" stroke="#7c3aed" stroke-width="0.8"/><rect x="164" y="110" width="26" height="26" fill="#ddd6fe" stroke="#7c3aed" stroke-width="0.8"/><rect x="60" y="136" width="26" height="26" fill="#fecaca" stroke="#7c3aed" stroke-width="0.8"/><rect x="86" y="136" width="26" height="26" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="112" y="136" width="26" height="26" fill="#fbcfe8" stroke="#7c3aed" stroke-width="0.8"/><rect x="138" y="136" width="26" height="26" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="164" y="136" width="26