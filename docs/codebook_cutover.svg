<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><title>hypernetwork codebook and cutover</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1000" height="380" fill="#ffffff"/><text x="500" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:19px;font-weight:700;fill:#111827">The VQ-VAE codebook: generated from noise, then frozen (“cutover”)</text><rect x="40" y="80" width="280" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="180.0" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Before cutover (step &lt; cutover_step)</text><text x="180.0" y="118" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">every forward pass:</text><text x="180.0" y="134" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">noise [256, hidden] ~ N(0, 1)</text><text x="180.0" y="150" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">-&gt; 6 transformer layers -&gt; RMSNorm -&gt; Linear</text><text x="180.0" y="166" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">-&gt; codebook [256, 64]   (new every pass!)</text><text x="180.0" y="182" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="180.0" y="198" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">acts as a strong regulariser: no dead codes</text><rect x="380" y="80" width="240" height="150" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.6"/><text x="500.0" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Cutover (once)</text><text x="500.0" y="118" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">sample the codebook one last time</text><text x="500.0" y="134" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">copy it into `learned_codebook`</text><text x="500.0" y="150" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">set the `cutover` flag (saved in ckpt)</text><text x="500.0" y="166" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">reset the optimizer</text><text x="500.0" y="182" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="500.0" y="198" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">config: vqvae.cutover_step</text><rect x="680" y="80" width="280" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="820.0" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">After cutover</text><text x="820.0" y="118" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codebook = learned_codebook [256, 64]</text><text x="820.0" y="134" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">a plain nn.Parameter, trained directly</text><text x="820.0" y="150" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">hypernetwork weights kept but unused</text><text x="820.0" y="166" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="820.0" y="182" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">the model is now a normal VQ-VAE;</text><text x="820.0" y="198" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">only now are codes stable enough to encode</text><line x1="322" y1="155" x2="378" y2="155" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="622" y1="155" x2="678" y2="155" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="260" width="920" height="95" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="500.0" y="280" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">FFHQ timeline from the original notes:  PSNR 24.4 dB at cutover (2 epochs, 2180 steps, 30 min)  -&gt;  25.2 dB after 5 epochs (6020 steps, 1 h)</text><text x="500.0" y="296" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Resuming a pre-cutover checkpoint past the step?  The trainer cuts over right after the next optimizer step.</text><text x="500.0" y="312" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Force it:  python scripts/01a_train_vqvae.py --resume runs/vqvae/latest --cutover-now</text></svg>