<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560"><title>stage 1 image codecs</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1180" height="560" fill="#ffffff"/><text x="590" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:19px;font-weight:700;fill:#111827">Stage 1: two image codecs with the same encoder / decoder, different bottlenecks</text><text x="590" y="52" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563;font-style:italic">“everything is an MLP”: tokens are refined independently; the only spatial mixing is one 3x3 conv in the decoder</text><rect x="40" y="130" width="80" height="64" rx="6" fill="#fde68a" stroke="#ca8a04" stroke-width="1.4"/><circle cx="80.0" cy="156.88" r="11.52" fill="#fbbf24" stroke="#ca8a04"/><path d="M56.0,187.6 Q80.0,165.2 104.0,187.6" fill="#f59e0b" stroke="#ca8a04"/><text x="80.0" y="210" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">input image</text><text x="80" y="230" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">[B, 3, 512, 512]</text><rect x="160" y="120" width="150" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="235.0" y="140" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">PixelUnshuffle(16)</text><text x="235.0" y="158" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">fold each 16x16 patch</text><text x="235.0" y="174" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">into channels</text><text x="235" y="230" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">[B, 768, 32, 32]</text><rect x="350" y="120" width="130" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="415.0" y="140" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">1x1 conv</text><text x="415.0" y="158" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">patch -&gt; hidden</text><text x="415.0" y="174" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">(768 -&gt; 256)</text><text x="415" y="230" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">[B, 256, 32, 32]</text><rect x="520" y="120" width="170" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="605.0" y="140" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">6 x MLPBlock2D</text><text x="605.0" y="158" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">RMSNorm2D -&gt; SwiGLU</text><text x="605.0" y="174" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">residual, per token</text><text x="605" y="230" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">[B, 256, 32, 32]</text><line x1="125" y1="162" x2="158" y2="162" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="312" y1="162" x2="348" y2="162" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="482" y1="162" x2="518" y2="162" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="400" y="102" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;fill:#4b5563">PatchEncoder  (latentgen/nn/codec.py)</text><rect x="740" y="80" width="400" height="118" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="940.0" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">VQ-VAE bottleneck  (stage 1a)</text><text x="940.0" y="118" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">RMSNorm2D -&gt; 1x1 conv to 64 channels</text><text x="940.0" y="134" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">snap each of the 1024 positions to its nearest codebook vector</text><text x="940.0" y="150" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codebook: hypernetwork(noise) until cutover, then a learned table</text><text x="940.0" y="166" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: codes [B, 32, 32] int + straight-through latent [B, 64, 32, 32]</text><rect x="740" y="214" width="400" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="940.0" y="234" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">AE bottleneck  (stage 1b)</text><text x="940.0" y="252" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">RMSNorm2D -&gt; 1x1 conv to 32 channels -&gt; tanh</text><text x="940.0" y="268" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: latent [B, 32, 32, 32] in [-1, 1]</text><line x1="692" y1="150" x2="738" y2="140" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="692" y1="175" x2="738" y2="250" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="590" y="320" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;fill:#4b5563">PatchDecoder  (same class, separate weights per model: the VQ-VAE&#x27;s decodes the quantized latent, the AE&#x27;s the tanh latent)</text><rect x="140" y="340" width="170" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="225.0" y="360" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">3x3 conv</text><text x="225.0" y="378" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">bottleneck -&gt; hidden</text><text x="225.0" y="394" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">the ONLY spatial mixing</text><rect x="350" y="340" width="170" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="435.0" y="360" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">6 x MLPBlock2D</text><text x="435.0" y="378" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">same block as the encoder</text><rect x="560" y="340" width="150" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="635.0" y="360" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">1x1 conv</text><text x="635.0" y="378" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">hidden -&gt; 768</text><rect x="750" y="340" width="160" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="830.0" y="360" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">PixelShuffle(16)</text><text x="830.0" y="378" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563">channels -&gt; 16x16 pixels</text><rect x="960" y="352" width="80" height="64" rx="6" fill="#fde68a" stroke="#ca8a04" stroke-width="1.4"/><circle cx="1000.0" cy="378.88" r="11.52" fill="#fbbf24" stroke="#ca8a04"/><path d="M976.0,409.6 Q1000.0,387.2 1024.0,409.6" fill="#f59e0b" stroke="#ca8a04"/><text x="1000.0" y="432" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">reconstruction</text><line x1="312" y1="385" x2="348" y2="385" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="522" y1="385" x2="558" y2="385" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="712" y1="385" x2="748" y2="385" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="912" y1="385" x2="958" y2="385" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M930,286 L930,300 L80,300 L80,385 L138,385" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="225" y="450" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">[B, 64 or 32, 32, 32]</text><text x="830" y="450" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">[B, 3, 512, 512]</text><rect x="140" y="470" width="900" height="70" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="590.0" y="490" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Loss: smooth-L1(10 * reconstruction, 10 * input)   + commitment loss for the VQ-VAE (pulls encoder outputs onto their codes)</text><text x="590.0" y="506" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Metric: PSNR on [0,1] images.  FFHQ: VQ-VAE ~25 dB after 5 epochs (768x compression); the AE is much sharper (24x compression).</text></svg>