<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500"><title>training loop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1180" height="500" fill="#ffffff"/><text x="590" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:19px;font-weight:700;fill:#111827">One training loop for all stages  (latentgen/training/loop.py)</text><text x="590" y="52" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563;font-style:italic">a Stage says what to do with one micro-batch and one step; the Trainer does everything else</text><rect x="40" y="90" width="250" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="165.0" y="110" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">data.batches(microbatch_size)</text><text x="165.0" y="128" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">ImageBatches (stages 1a/1b)</text><text x="165.0" y="144" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">or EncodedDataset (stages 2/3)</text><text x="165.0" y="160" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="165.0" y="176" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">only the ids NOT seen this epoch</text><line x1="292" y1="145" x2="340" y2="145" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="345" y="90" width="250" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="470.0" y="110" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">stage.microbatch(batch, scale)</text><text x="470.0" y="128" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">forward under bf16 autocast</text><text x="470.0" y="144" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">(loss * scale).backward()</text><text x="470.0" y="160" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">scale = 1 / microbatches_per_step</text><text x="470.0" y="176" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">logger.log(...) -- no GPU sync</text><path d="M470,202 L470,230 L420,230 L420,202" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545" y="232" text-anchor="start" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">x microbatches_per_step  (batch_size / microbatch_size)</text><line x1="597" y1="145" x2="645" y2="145" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="90" width="230" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="765.0" y="110" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">stage.step()</text><text x="765.0" y="128" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">clip_grad_norm</text><text x="765.0" y="144" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">skip the step if non-finite</text><text x="765.0" y="160" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">optimizer.step(), EMA</text><text x="765.0" y="176" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">stage.on_step(step)  e.g. cutover</text><line x1="882" y1="145" x2="930" y2="145" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="935" y="70" width="210" height="150" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="1040.0" y="90" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">every N steps</text><text x="1040.0" y="108" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">log_every: console + TensorBoard</text><text x="1040.0" y="124" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">image_every: progress PNG</text><text x="1040.0" y="140" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">save_every_seconds / _steps:</text><text x="1040.0" y="156" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">   checkpoint</text><text x="1040.0" y="172" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="1040.0" y="188" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Ctrl-C: save + exit</text><rect x="40" y="280" width="440" height="200" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.6"/><text x="260.0" y="300" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">runs/&lt;stage&gt;/&lt;run_name&gt;/</text><text x="56" y="318" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">config.yaml                   full config of this run</text><text x="56" y="334" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">checkpoints/step_00001234.pt  models, optimizers, EMA,</text><text x="56" y="350" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">                              epoch progress, seen ids</text><text x="56" y="366" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">tensorboard/                  tensorboard --logdir runs</text><text x="56" y="382" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">images/step_00000020.png      progress images</text><text x="56" y="398" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563"></text><text x="56" y="414" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">--resume runs/&lt;stage&gt;/latest  newest run, newest step</text><text x="56" y="430" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">--resume runs/&lt;stage&gt;/&lt;run&gt;   that run, newest step</text><text x="56" y="446" text-anchor="start" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:normal;fill:#4b5563">--resume path/to/step_*.pt    that file</text><rect x="500" y="280" width="645" height="200" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="822.5" y="300" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">What a checkpoint restores</text><text x="822.5" y="318" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">weights (schedule-free runs save the averaged weights, the ones to sample with)</text><text x="822.5" y="334" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">optimizer state (dropped automatically if you changed a layer size)</text><text x="822.5" y="350" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">generator EMA, stage state (e.g. which GAN phase we were in)</text><text x="822.5" y="366" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">epoch, step, micro-batch count, and the set of image ids already seen this epoch</text><text x="822.5" y="382" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="822.5" y="398" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">so a resumed run finishes the SAME epoch on the images it had not seen yet,</text><text x="822.5" y="414" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">and `--set` can still change learning rate, batch size, epochs ... on resume.</text><text x="822.5" y="430" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="822.5" y="446" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">ModelManager = model + compiled forward + optimizer + EMA  (latentgen/training/manager.py)</text></svg>