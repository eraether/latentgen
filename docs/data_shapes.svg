<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420"><title>tensor shapes through the pipeline</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1180" height="420" fill="#ffffff"/><text x="590" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:19px;font-weight:700;fill:#111827">What one image becomes (FFHQ 512 settings)</text><text x="590" y="52" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563;font-style:italic">arrows: what is produced from what, and what each model reads / writes</text><rect x="60" y="120" width="90" height="72" rx="6" fill="#fde68a" stroke="#ca8a04" stroke-width="1.4"/><circle cx="105.0" cy="150.24" r="12.959999999999999" fill="#fbbf24" stroke="#ca8a04"/><path d="M78.0,184.8 Q105.0,159.6 132.0,184.8" fill="#f59e0b" stroke="#ca8a04"/><text x="105.0" y="208" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">image</text><text x="105" y="226" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">3 x 512 x 512</text><text x="105" y="240" text-anchor="middle" xml:space="preserve" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace;font-size:10px;font-weight:normal;fill:#4b5563">786,432 values</text><rect x="260" y="80" width="230" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="375.0" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">VQ codes  (stage 1a)</text><text x="375.0" y="118" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">32 x 32 = 1,024 ints in 0..255</text><text x="375.0" y="134" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">stored as int16</text><text x="375.0" y="150" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">768x smaller</text><rect x="260" y="210" width="230" height="100" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="375.0" y="230" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">AE latent  (stage 1b)</text><text x="375.0" y="248" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">32 x 32 x 32 = 32,768 values</text><text x="375.0" y="264" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">tanh, stored as int8</text><text x="375.0" y="280" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">24x smaller</text><line x1="155" y1="150" x2="258" y2="125" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="155" y1="170" x2="258" y2="255" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="600" y="80" width="260" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="730.0" y="100" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">MaskGIT  (stage 2)</text><text x="730.0" y="118" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">in: a code grid with holes</text><text x="730.0" y="134" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: 256 logits per position</text><text x="730.0" y="150" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">[32, 32, 256]</text><rect x="600" y="210" width="260" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="730.0" y="230" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">GAN generator  (stage 3)</text><text x="730.0" y="248" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">in: a code grid (+ noise)</text><text x="730.0" y="264" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: a latent of the AE&#x27;s shape</text><text x="730.0" y="280" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">[32, 32, 32] in [-1, 1]</text><line x1="492" y1="130" x2="598" y2="130" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545.0" y="122.0" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">models p(codes)</text><line x1="492" y1="130" x2="598" y2="255" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545.0" y="206.5" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">conditions on</text><line x1="598" y1="258" x2="492" y2="258" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="545.0" y="250.0" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">imitates</text><rect x="920" y="120" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1030.0" y="140" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Decoding</text><text x="1030.0" y="158" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codes -&gt; VQ decoder -&gt; image</text><text x="1030.0" y="174" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">latent -&gt; AE decoder -&gt; image</text><text x="1030.0" y="190" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="1030.0" y="206" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">both produce 3 x 512 x 512</text><line x1="862" y1="260" x2="918" y2="200" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="60" y="340" width="1080" height="65" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="600.0" y="360" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">patch_size (16) is the one knob behind every shape: grid = image_size / patch_size. 256 px images give 16 x 16 grids (4x fewer tokens).</text><text x="600.0" y="376" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codebook_size (256) is MaskGIT&#x27;s vocabulary; the AE&#x27;s bottleneck_dim (32) is what the GAN must produce per position.</text></svg>