<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600"><title>stage 3 conditional GAN</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern></defs><rect width="1180" height="600" fill="#ffffff"/><text x="590" y="30" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:19px;font-weight:700;fill:#111827">Stage 3: the conditional GAN adds back the detail the VQ codes threw away</text><text x="590" y="52" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:normal;fill:#4b5563;font-style:italic">codes (768x compressed) -&gt; AE latent (24x compressed); the frozen AE decoder turns that into pixels</text><rect x="50" y="110" width="24" height="24" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="74" y="110" width="24" height="24" fill="#fbcfe8" stroke="#7c3aed" stroke-width="0.8"/><rect x="98" y="110" width="24" height="24" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="122" y="110" width="24" height="24" fill="#fed7aa" stroke="#7c3aed" stroke-width="0.8"/><rect x="50" y="134" width="24" height="24" fill="#fecaca" stroke="#7c3aed" stroke-width="0.8"/><rect x="74" y="134" width="24" height="24" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="98" y="134" width="24" height="24" fill="#fbcfe8" stroke="#7c3aed" stroke-width="0.8"/><rect x="122" y="134" width="24" height="24" fill="#bbf7d0" stroke="#7c3aed" stroke-width="0.8"/><rect x="50" y="158" width="24" height="24" fill="#a5f3fc" stroke="#7c3aed" stroke-width="0.8"/><rect x="74" y="158" width="24" height="24" fill="#fecaca" stroke="#7c3aed" stroke-width="0.8"/><rect x="98" y="158" width="24" height="24" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><rect x="122" y="158" width="24" height="24" fill="#fbcfe8" stroke="#7c3aed" stroke-width="0.8"/><rect x="50" y="182" width="24" height="24" fill="#fde68a" stroke="#7c3aed" stroke-width="0.8"/><rect x="74" y="182" width="24" height="24" fill="#a5f3fc" stroke="#7c3aed" stroke-width="0.8"/><rect x="98" y="182" width="24" height="24" fill="#fecaca" stroke="#7c3aed" stroke-width="0.8"/><rect x="122" y="182" width="24" height="24" fill="#bfdbfe" stroke="#7c3aed" stroke-width="0.8"/><text x="98.0" y="222" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">codes [B,32,32]</text><line x1="150" y1="158" x2="200" y2="158" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="205" y="95" width="300" height="125" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="355.0" y="115" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Generator</text><text x="355.0" y="133" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">code embedding + Linear(noise ~ N(0,1)) per position</text><text x="355.0" y="149" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">12 x TransformerLayer with RoPE</text><text x="355.0" y="165" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">RMSNorm -&gt; Linear(32) -&gt; tanh</text><text x="355.0" y="181" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: fake latent [B, 32, 32, 32] in [-1, 1]</text><line x1="507" y1="158" x2="560" y2="158" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="533.5" y="152.0" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">fake</text><rect x="205" y="250" width="300" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="355.0" y="270" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Real latent from fine_encoded.pt</text><text x="355.0" y="288" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">int8 / 127 + dequantization noise, clamp [-1, 1]</text><line x1="507" y1="285" x2="560" y2="200" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="533.5" y="254.5" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">real</text><rect x="565" y="95" width="300" height="160" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="715.0" y="115" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Discriminator</text><text x="715.0" y="133" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">code embedding + Linear(latent) per position</text><text x="715.0" y="149" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">16 x TransformerLayer with RoPE</text><text x="715.0" y="165" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">RMSNorm -&gt; Linear(1) -&gt; mean over positions</text><text x="715.0" y="181" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">out: one real/fake logit per image</text><text x="715.0" y="197" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="715.0" y="213" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">sees the codes too: “does this latent fit these codes?”</text><line x1="867" y1="175" x2="920" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="925" y="95" width="215" height="160" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/><text x="1032.5" y="115" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Losses (BCE)</text><text x="1032.5" y="133" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">D: real -&gt; 1, fake -&gt; 0</text><text x="1032.5" y="149" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">G: fake -&gt; 1 (D frozen,</text><text x="1032.5" y="165" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">    only input grads flow)</text><text x="1032.5" y="181" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563"></text><text x="1032.5" y="197" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">logit beyond +-0.5 counts</text><text x="1032.5" y="213" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">as a confident call</text><text x="590" y="345" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Who trains this step?  (CGANStage.step)</text><rect x="150" y="360" width="330" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="315.0" y="380" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Discriminator phase</text><text x="315.0" y="398" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">D steps on real + fake</text><text x="315.0" y="414" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">G only produces fakes (no grads)</text><text x="315.0" y="430" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">stays here while D accuracy &lt;= 85 %</text><rect x="700" y="360" width="330" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="865.0" y="380" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;fill:#111827">Generator phase</text><text x="865.0" y="398" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">G steps against the frozen D</text><text x="865.0" y="414" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">D keeps scoring the new fakes</text><text x="865.0" y="430" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">stays here while D accuracy &gt; 85 %</text><path d="M482,390 L698,390" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="590" y="382" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">D accuracy on real AND fake &gt; 85 %</text><path d="M698,425 L482,425" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="590" y="442" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">D fooled: fake accuracy &lt;= 85 %</text><rect x="150" y="480" width="880" height="100" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="590.0" y="500" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Generator EMA: every 10 successful generator steps, ema = 0.99 * ema + 0.01 * weights  (half-life ~690 generator steps).</text><text x="590.0" y="516" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Inference samples from the EMA copy (generate.use_ema). Progress images show  real | generator | EMA  decoded by the frozen AE.</text><text x="590.0" y="532" text-anchor="middle" xml:space="preserve" style="font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;font-weight:normal;fill:#4b5563">Optimizer: plain AdamW (betas 0.5 / 0.999, no weight decay) with a 100-step warm-up -- not schedule-free, as GANs need the live weights.</text></svg>