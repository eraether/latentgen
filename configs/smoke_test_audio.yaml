# Tiny 1-D (audio) smoke test: same as smoke_test.yaml but on short synthetic wav clips.
#     python scripts/make_smoke_data.py --audio --out data/smoke/audio
#     bash scripts/run_pipeline.sh configs/smoke_test_audio.yaml
project: {runs_dir: runs_smoke_audio, seed: 0, compile: false, allow_cpu: true}
data:
  kind: audio
  image_dir: data/smoke/audio
  audio_length: 1024          # 1024 / patch 16 = a 1 x 64 code grid
  sample_rate: 16000
  num_workers: 0
  encoded_file: data/smoke/audio_encoded.pt
vqvae:
  model: {hidden_size: 32, intermediate_size: 64, num_encoder_layers: 2, num_decoder_layers: 2,
          bottleneck_dim: 8, codebook_size: 16, num_codebook_layers: 1, num_attention_heads: 4, patch_size: 16}
  train: {epochs: 2, batch_size: 8, microbatch_size: 4, log_every: 2, image_every: 4, optimizer: {warmup_steps: 2}}
  cutover_step: 6
autoencoder:
  model: {hidden_size: 32, intermediate_size: 64, num_encoder_layers: 2, num_decoder_layers: 2, bottleneck_dim: 4, patch_size: 16}
  train: {epochs: 2, batch_size: 8, microbatch_size: 4, log_every: 2, image_every: 4, optimizer: {warmup_steps: 2}}
encode: {batch_size: 8}
maskgit:
  model: {hidden_size: 32, intermediate_size: 64, num_layers: 2, num_attention_heads: 4}
  train: {epochs: 2, batch_size: 16, microbatch_size: 8, log_every: 2, optimizer: {warmup_steps: 2}}
cgan:
  generator:     {hidden_size: 32, intermediate_size: 64, num_layers: 2, num_attention_heads: 4}
  discriminator: {hidden_size: 32, intermediate_size: 64, num_layers: 2, num_attention_heads: 4}
  train: {epochs: 2, batch_size: 16, microbatch_size: 8, log_every: 2, image_every: 2, optimizer: {warmup_steps: 2}}
generate: {out_dir: runs_smoke_audio/generated, num_images: 4, batch_size: 2, keep_schedule: [0.25, 0.5]}
