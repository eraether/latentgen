# =============================================================================================
#  Tiny everything: proves the whole pipeline runs end to end in a few minutes.
#
#      python scripts/make_smoke_data.py          # writes 64 random 64x64 images to data/smoke/images
#      bash scripts/run_pipeline.sh configs/smoke_test.yaml
#
#  Runs on a GPU in ~2 minutes, or on CPU (allow_cpu) in ~10. The outputs are garbage -- the point
#  is that every script, checkpoint, resume path and loader works before you spend GPU-days.
# =============================================================================================

project:
  runs_dir: runs_smoke
  seed: 0
  compile: false              # compile time would dominate such a tiny run
  allow_cpu: true

data:
  image_dir: data/smoke/images
  image_size: 64              # 64 / patch 16 = 4x4 grid
  num_workers: 0
  encoded_file: data/smoke/encoded.pt
  encoded_device: cpu

vqvae:
  model: {hidden_size: 32, intermediate_size: 64, num_encoder_layers: 2, num_decoder_layers: 2,
          bottleneck_dim: 8, codebook_size: 16, num_codebook_layers: 1, num_attention_heads: 4, patch_size: 16}
  train: {epochs: 2, batch_size: 8, microbatch_size: 4, log_every: 2, image_every: 4, save_every_steps: 8,
          optimizer: {warmup_steps: 2}}
  cutover_step: 6

autoencoder:
  model: {hidden_size: 32, intermediate_size: 64, num_encoder_layers: 2, num_decoder_layers: 2,
          bottleneck_dim: 4, patch_size: 16}
  train: {epochs: 2, batch_size: 8, microbatch_size: 4, log_every: 2, image_every: 4,
          optimizer: {warmup_steps: 2}}

encode:
  batch_size: 8

maskgit:
  model: {hidden_size: 32, intermediate_size: 64, num_layers: 2, num_attention_heads: 4}
  train: {epochs: 2, batch_size: 16, microbatch_size: 8, log_every: 2, optimizer: {warmup_steps: 2}}

cgan:
  generator:     {hidden_size: 32, intermediate_size: 64, num_layers: 2, num_attention_heads: 4}
  discriminator: {hidden_size: 32, intermediate_size: 64, num_layers: 2, num_attention_heads: 4}
  train: {epochs: 2, batch_size: 16, microbatch_size: 8, log_every: 2, image_every: 2, optimizer: {warmup_steps: 2}}

generate:
  out_dir: runs_smoke/generated
  num_images: 4
  batch_size: 2
  keep_schedule: [0.25, 0.5]
