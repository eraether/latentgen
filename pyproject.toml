[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latentgen"
version = "2.0.0"
description = "Dataset-agnostic four-stage latent generative pipeline (images or audio): VQ-VAE + AE -> MaskGIT -> conditional GAN."
readme = "README.md"
requires-python = ">=3.10"
# PyTorch is intentionally NOT listed here. Install the build that matches
# your GPU first (see install.sh / README "Installation"), then `pip install -e .`
dependencies = [
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "pillow>=9.0",
    "tensorboard>=2.12",
    "schedulefree>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["latentgen*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B027"]  # B027: optional Stage hooks are intentionally empty

[tool.pytest.ini_options]
testpaths = ["tests"]
